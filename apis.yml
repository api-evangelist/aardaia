name: aardaia
description: Aardaia is a Wageningen (Netherlands) agri-biotech startup that turns wild plant species
  into new commercial crops through accelerated domestication, combining classical plant breeding with
  modern genomics and AI rather than genetic modification. Its flagship is the aardaker, a nitrogen-fixing
  legume-tuber that yields a naturally protein-rich crop (roughly 10g protein per 100g of fresh tuber)
  without synthetic fertilizer. The company raised a EUR 5M seed round led by Point Nine in 2026. Aardaia
  does not currently publish a public API, developer portal, or SDKs; this profile is maintained in the
  API Evangelist network as a Point Nine portfolio lead.
